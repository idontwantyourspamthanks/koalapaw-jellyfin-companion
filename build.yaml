name: "KoalaPaw Server Companion"
guid: "cea40e65-c04f-4854-b6c4-3428360087fe"
version: "0.0.11.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Skip intros and even out video loudness for KoalaPaw (and any Jellyfin client)."
description: >
  Open-source Jellyfin companion for KoalaPaw. Analyses your library in the
  background and writes standard Jellyfin fields (NormalizationGain, MediaSegments)
  so clients stay thin. Makes zero outbound network calls.
category: "General"
owner: "koalapaw"
artifacts:
  - "KoalaPaw.ServerCompanion.dll"
changelog: >
  0.0.11.0 — Intro & Outro dashboard page: trigger the scan and watch live progress, then drill Library → Series → Season → Episode to see per-item intro/outro placement, season-level detection confidence, and failure state. Per-season scan records persist across runs; successful analysis now clears an item's earlier failure record. New admin endpoints under /KoalaPaw/Segments (Overview/Series/Seasons/Episodes + per-season Rescan).
  0.0.10.0 — Intro/credits scan reports its outcome: episodes scanned, intros/outros found, and mean correlation confidence, exposed at GET /KoalaPaw/Segments/Report (admin) so the TV's scan page can show why a show came back empty.
  0.0.9.1 — Fix dashboard JS field casing (Jellyfin serializes PascalCase) so the failure count, list, and retry buttons actually populate.
  0.0.9.0 — Dashboard: per-failure retry (clears the record and queues the scan), loudness/segments "scan now" buttons, failure list with item names; API endpoints now require admin elevation.
  0.0.8.0 — Failure tracking (AnalysisStore) so undetectable items aren't retried forever; library-scan and startup triggers; plugin configuration (toggles, LUFS target, batch caps, fingerprint windows); dashboard web page with settings and failure log; HeartbeatTask repurposed as health check.
  0.0.7.0 — Fix loudnorm stderr race, segment staging leak, DI registration, changelog packaging; reduce chromaprint head window 600→200s; TreatWarningsAsErrors; new tests.
  0.0.6.0 — Credits/Outro: chromaprint tail correlation; stage Intro+Outro together; drop spike-2 fixture.
  0.0.5.2 — Intro scan: IncludeItemTypes Episode (fix unknown-type deserialize crash).
  0.0.5.1 — Intro MediaSegments (chromaprint season scan) + manual spike-2 fixture; provider registered.
  0.0.5.0 — First intro-scan publish (superseded).
  0.0.4.0 — Remove spike 1 DEV task; loudness scan is the production path.
  0.0.3.1 — Loudness scan: IncludeItemTypes Episode/Movie (avoid unknown-type deserialize crash).
  0.0.3.0 — Video loudness scan: ffmpeg loudnorm → NormalizationGain (daily/interval).
  0.0.2.0 — Spike 1 task: write NormalizationGain on a video episode (manual run).
  0.0.1.0 — Skeleton: registers and logs a heartbeat scheduled task.